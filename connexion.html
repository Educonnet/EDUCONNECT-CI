
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser mon mot de passe | EDUCONNECT CI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8fc;
      color: #17324d;
    }
    header {
      padding: 22px;
      text-align: center;
      color: white;
      background: #073b70;
    }
    main {
      width: min(92%, 460px);
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #bdcbd9;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #087b55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
    a { color: #087b55; }
  </style>
</head>
<body>
  <header>
    <h1>EDUCONNECT CI</h1>
    <p>Nouveau mot de passe</p>
  </header>

  <main>
    <h2>Réinitialiser mon mot de passe</h2>
    <p>Choisis un nouveau mot de passe pour ton compte.</p>

    <form id="formReset" hidden>
      <label for="nouveauMotDePasse">Nouveau mot de passe</label>
      <input id="nouveauMotDePasse" type="password"
             autocomplete="new-password" minlength="8" required>

      <label for="confirmationMotDePasse">Confirmer le mot de passe</label>
      <input id="confirmationMotDePasse" type="password"
             autocomplete="new-password" minlength="8" required>

      <button id="boutonReset" type="submit">
        Enregistrer le nouveau mot de passe
      </button>
    </form>

    <p id="message" role="status" aria-live="polite">
      Vérification du lien de récupération...
    </p>

    <p><a href="connexion.html">Retour à la connexion</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const formulaire = document.getElementById("formReset");
    const message = document.getElementById("message");
    const bouton = document.getElementById("boutonReset");

    
async function initialiser() {
  try {
    if (!window.eduSupabase) {
      throw new Error("Service Supabase indisponible.");
    }

    const supabase = window.eduSupabase;
    const url = new URL(window.location.href);

    // Vérifier si Supabase a retourné une erreur.
    const hashParams = new URLSearchParams(
      url.hash.substring(1)
    );

    const errorCode =
      url.searchParams.get("error_code") ||
      hashParams.get("error_code");

    const errorDescription =
      url.searchParams.get("error_description") ||
      hashParams.get("error_description");

    if (errorCode) {
      throw new Error(
        errorDescription
          ? decodeURIComponent(errorDescription.replace(/\+/g, " "))
          : "Le lien de récupération est invalide ou expiré."
      );
    }

    // Récupérer les paramètres de retour.
    const code = url.searchParams.get("code");
    const accessToken = hashParams.get("access_token");
    const refreshToken = hashParams.get("refresh_token");

    // Échanger le code PKCE uniquement si nécessaire.
    if (code) {
      const { error } =
        await supabase.auth.exchangeCodeForSession(code);

      if (error) throw error;
    }
    // Restaurer la session si le lien contient les jetons.
    else if (accessToken && refreshToken) {
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) throw error;
    }

    // Vérifier la session finale.
    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    if (!data.session) {
      throw new Error(
        "Aucune session de récupération détectée. Demande un nouveau lien."
      );
    }

    formulaire.hidden = false;

    message.textContent =
      "Lien vérifié. Tu peux maintenant choisir ton nouveau mot de passe.";

  } catch (erreur) {
    console.error("Erreur de récupération :", erreur);
    message.textContent = erreur.message;
  }
}


    initialiser();
  </script>
</body>
</html>
