
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - EDUCONNECT CI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }
    h1, h2 { text-align: center; color: #174ea6; }
    label { display: block; margin-top: 15px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }
    #message { margin-top: 15px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="container">
    <h1>EDUCONNECT CI</h1>
    <h2>Créer un compte apprenant</h2>
    <p>Crée ton compte pour accéder aux formations.</p>

    <form id="inscription-form">
      <label for="full_name">Nom complet</label>
      <input id="full_name" name="full_name"
             type="text" required>

      <label for="email">Adresse e-mail</label>
      <input id="email" name="email"
             type="email" required>

      <label for="password">Mot de passe (8 caractères minimum)</label>
      <input id="password" name="password"
             type="password" minlength="8" required>

      <button type="submit">Créer mon compte</button>
    </form>

<p id="message" role="status"></p>
<p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
<p><a href="index.html">Retour à l’accueil</a></p>
</main>
